spring.application.name=apimatriculas

# ---------- Banco: H2 em memoria ----------
spring.datasource.url=jdbc:h2:mem:matriculas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop derruba o schema no fechamento do contexto.
# Com H2 em memoria isso quase nao muda nada na app rodando, mas nos testes
# varios contextos Spring dividem a mesma JVM e isso evita um sujar o outro.
# Efeito colateral: todo dado some a cada boot, entao os dados de exemplo
# precisam ser recriados na subida.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desligado de proposito. Com open-in-view ligado a sessao JPA fica aberta ate o
# fim do request, entao um @ManyToOne LAZY carrega silenciosamente durante a
# serializacao e o N+1 passa despercebido. Desligado, o acesso fora da
# transacao estoura LazyInitializationException e o problema aparece no teste.
spring.jpa.open-in-view=false

# ---------- Console do H2: http://localhost:8080/h2-console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- OpenAPI / Swagger: http://localhost:8080/swagger-ui.html ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
